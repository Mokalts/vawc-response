<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" preserveAspectRatio="xMidYMid slice">
  <!-- Same composition as bg-shapes.svg, retuned for the dark theme: the light
       accent tokens (#FF9A4D, #C084FC, #F472B6, #34D399) at reduced opacity so
       the shapes read as depth on #171311 rather than glow. Keep the two files
       in sync when editing the layout. -->
  <defs>
    <radialGradient id="gWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF9A4D" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FF9A4D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#C084FC" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#F472B6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#34D399" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FF9A4D" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FF9A4D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF9A4D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineViolet" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C084FC" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#C084FC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="760" cy="130"  rx="430" ry="360" fill="url(#gWarm)"/>
  <ellipse cx="110" cy="1180" rx="420" ry="380" fill="url(#gViolet)"/>
  <ellipse cx="880" cy="960"  rx="330" ry="300" fill="url(#gRose)"/>
  <ellipse cx="40"  cy="300"  rx="300" ry="280" fill="url(#gGreen)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M-40 470 C 170 380, 360 470, 470 620" stroke="url(#lineWarm)"   stroke-width="2.5" opacity="0.32"/>
    <path d="M-40 530 C 190 440, 400 540, 520 700" stroke="url(#lineWarm)"   stroke-width="1.6" opacity="0.22"/>
    <path d="M940 820 C 740 740, 560 830, 470 980" stroke="url(#lineViolet)" stroke-width="2.5" opacity="0.28"/>
    <path d="M940 880 C 720 800, 520 900, 430 1060" stroke="url(#lineViolet)" stroke-width="1.6" opacity="0.2"/>
  </g>

  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M726 250 c56 22 92 30 92 30 v78 c0 92-92 140-92 140 s-92-48-92-140 v-78 c0 0 36-8 92-30 z"
          stroke="#FF9A4D" stroke-width="2" opacity="0.07"/>
    <path d="M170 1046 c38 15 62 20 62 20 v53 c0 62-62 95-62 95 s-62-33-62-95 v-53 c0 0 24-5 62-20 z"
          stroke="#C084FC" stroke-width="2" opacity="0.06"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M300 1290 c0-70 58-124 128-124 s128 54 128 124" stroke="#FF9A4D" stroke-width="2.2" opacity="0.07"/>
    <path d="M262 1300 c0-92 76-164 166-164 s166 72 166 164"  stroke="#F472B6" stroke-width="1.8" opacity="0.05"/>
    <path d="M596 96 c0-52 43-92 95-92 s95 40 95 92"          stroke="#34D399" stroke-width="1.8" opacity="0.05"/>
  </g>

  <circle cx="182" cy="742" r="86" fill="none" stroke="#FF9A4D" stroke-width="1.6" opacity="0.07"/>
  <circle cx="812" cy="560" r="54" fill="none" stroke="#F472B6" stroke-width="1.6" opacity="0.06"/>
</svg>
