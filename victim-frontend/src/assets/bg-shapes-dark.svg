<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" preserveAspectRatio="xMidYMid slice">
  <!-- Same composition as bg-shapes.svg, retuned for the dark theme: the light
       accent tokens (#FF9A4D, #C084FC, #F472B6, #34D399) at lower opacity so
       the shapes stay legible on #171311 without glowing. Keep the two files in
       sync when editing the layout. -->
  <defs>
    <pattern id="dotO" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2.4" cy="2.4" r="1.8" fill="#FF9A4D"/>
    </pattern>
    <pattern id="dotV" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#C084FC"/>
    </pattern>
    <pattern id="hatchP" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#F472B6" stroke-width="2"/>
    </pattern>
    <pattern id="hatchG" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#34D399" stroke-width="2"/>
    </pattern>
  </defs>

  <path d="M900 0v352c-142 44-286 4-352-88-52-72-8-186 96-264Z" fill="#FF9A4D" opacity="0.095"/>
  <path d="M0 1400v-330c150-64 316 30 366 146 44 100-34 184-152 184Z" fill="#C084FC" opacity="0.07"/>
  <path d="M0 96v268c104 32 190-24 208-104 16-72-40-142-118-164Z" fill="#34D399" opacity="0.05"/>
  <path d="M900 1400v-206c-108-44-232 8-274 86-34 62 10 120 84 120Z" fill="#F472B6" opacity="0.055"/>

  <rect x="24" y="468" width="150" height="150" fill="url(#dotO)" opacity="0.19"/>
  <rect x="726" y="856" width="150" height="132" fill="url(#dotV)" opacity="0.17"/>
  <rect x="700" y="470" width="104" height="88" fill="url(#dotO)" opacity="0.11"/>
  <rect x="60" y="1188" width="132" height="96" fill="url(#dotV)" opacity="0.12"/>

  <circle cx="806" cy="676" r="92" fill="url(#hatchP)" opacity="0.12"/>
  <circle cx="112" cy="852" r="70" fill="url(#hatchG)" opacity="0.12"/>
  <circle cx="640" cy="1216" r="54" fill="url(#hatchP)" opacity="0.085"/>

  <circle cx="156" cy="288" r="66" fill="none" stroke="#FF9A4D" stroke-width="2" opacity="0.19"/>
  <circle cx="792" cy="1042" r="44" fill="none" stroke="#F472B6" stroke-width="2" opacity="0.16"/>
  <circle cx="252" cy="1044" r="28" fill="none" stroke="#C084FC" stroke-width="2" opacity="0.18"/>
  <circle cx="700" cy="196" r="34" fill="none" stroke="#34D399" stroke-width="2" opacity="0.14"/>

  <circle cx="836" cy="392" r="10" fill="#FF9A4D" opacity="0.19"/>
  <circle cx="64"  cy="668" r="8"  fill="#34D399" opacity="0.17"/>
  <circle cx="860" cy="1256" r="12" fill="#F472B6" opacity="0.14"/>
  <circle cx="196" cy="132" r="7"  fill="#C084FC" opacity="0.16"/>

  <g stroke="#FF9A4D" stroke-width="2.6" stroke-linecap="round" opacity="0.17">
    <path d="M700 790l28-40M730 790l28-40M760 790l28-40"/>
  </g>
  <g stroke="#C084FC" stroke-width="2.6" stroke-linecap="round" opacity="0.14">
    <path d="M84 1010l26-36M112 1010l26-36M140 1010l26-36"/>
  </g>
  <g stroke="#F472B6" stroke-width="2.6" stroke-linecap="round" opacity="0.13">
    <path d="M118 606l24-34M144 606l24-34"/>
  </g>
</svg>
