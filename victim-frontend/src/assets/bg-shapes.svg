<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" preserveAspectRatio="xMidYMid slice">
  <!-- Victim portal page backdrop (light theme).

       Brief: strictly minimal. Themes of safety, protection and support, drawn
       as gentle interlocking curves, soft flowing lines, and two highly
       abstracted shield outlines. Nothing here is meant to be identified as an
       object; it should read as texture. Everything sits at 0.05 to 0.10
       opacity so foreground cards and body copy stay fully readable.

       Palette: orange #F47920 / #C45E10, violet #7B2D8B, pink #BE185D,
       green #047857 (the app's accent tokens).

       Portrait viewBox on purpose: this is a phone-first app, and a landscape
       composition scaled with `cover` on a 375x812 screen crops to a narrow
       centre slice. Keep bg-shapes-dark.svg in sync. -->
  <defs>
    <!-- Smooth depth washes, no hard edges -->
    <radialGradient id="gWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#F47920" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F47920" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7B2D8B" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#7B2D8B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#BE185D" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#BE185D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#047857" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#C45E10" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#C45E10" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C45E10" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineViolet" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7B2D8B" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#7B2D8B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7B2D8B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. Depth: four soft washes, corner-weighted so the middle stays clean -->
  <ellipse cx="760" cy="130"  rx="430" ry="360" fill="url(#gWarm)"/>
  <ellipse cx="110" cy="1180" rx="420" ry="380" fill="url(#gViolet)"/>
  <ellipse cx="880" cy="960"  rx="330" ry="300" fill="url(#gRose)"/>
  <ellipse cx="40"  cy="300"  rx="300" ry="280" fill="url(#gGreen)"/>

  <!-- 2. Shelter: interlocking curves, one arc cradling another. The gradient
          strokes fade out at both ends so no line terminates abruptly. -->
  <g fill="none" stroke-linecap="round">
    <path d="M-40 470 C 170 380, 360 470, 470 620" stroke="url(#lineWarm)"   stroke-width="2.5" opacity="0.5"/>
    <path d="M-40 530 C 190 440, 400 540, 520 700" stroke="url(#lineWarm)"   stroke-width="1.6" opacity="0.35"/>
    <path d="M940 820 C 740 740, 560 830, 470 980" stroke="url(#lineViolet)" stroke-width="2.5" opacity="0.45"/>
    <path d="M940 880 C 720 800, 520 900, 430 1060" stroke="url(#lineViolet)" stroke-width="1.6" opacity="0.3"/>
  </g>

  <!-- 3. Protection: two highly abstracted shields, outline only, very faint -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M726 250 c56 22 92 30 92 30 v78 c0 92-92 140-92 140 s-92-48-92-140 v-78 c0 0 36-8 92-30 z"
          stroke="#C45E10" stroke-width="2" opacity="0.10"/>
    <path d="M170 1046 c38 15 62 20 62 20 v53 c0 62-62 95-62 95 s-62-33-62-95 v-53 c0 0 24-5 62-20 z"
          stroke="#7B2D8B" stroke-width="2" opacity="0.09"/>
  </g>

  <!-- 4. Support: open, cupped curves. Two hands suggested, never drawn. -->
  <g fill="none" stroke-linecap="round">
    <path d="M300 1290 c0-70 58-124 128-124 s128 54 128 124" stroke="#C45E10" stroke-width="2.2" opacity="0.10"/>
    <path d="M262 1300 c0-92 76-164 166-164 s166 72 166 164"  stroke="#BE185D" stroke-width="1.8" opacity="0.07"/>
    <path d="M596 96 c0-52 43-92 95-92 s95 40 95 92"          stroke="#047857" stroke-width="1.8" opacity="0.07"/>
  </g>

  <!-- 5. Two quiet rings for rhythm, nothing more -->
  <circle cx="182" cy="742" r="86" fill="none" stroke="#C45E10" stroke-width="1.6" opacity="0.10"/>
  <circle cx="812" cy="560" r="54" fill="none" stroke="#BE185D" stroke-width="1.6" opacity="0.08"/>
</svg>
