<!DOCTYPE html>
<html lang="fil">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/barangay-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F47920" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171311" media="(prefers-color-scheme: dark)" />
    <!-- Preconnect + load the app font here to avoid a per-page FOUT / layout shift.
         Lexend: reading-optimised for legibility (trauma-informed, low-literacy audience). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap"
    />
    <!-- Apply saved theme before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          // Default to LIGHT until every page is dark-ready. Only honour an
          // explicit user choice (the toggle). Re-enable OS auto-dark
          // (prefers-color-scheme) once the dark rollout is complete.
          var t = localStorage.getItem('vawc_theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="VAWC-Response — Digital reporting and case monitoring system for Barangay Palanginan, Iba, Zambales (RA 9262)."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/barangay-logo.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>VAWC-Response</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
